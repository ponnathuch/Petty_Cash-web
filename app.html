<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เงินสดย่อย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root {
  --c-page: #f2f5f4; --c-surface: #ffffff; --c-surface-2: #f6f9f8; --c-line: #e3e9e6; --c-line-strong: #cfd9d4;
  --c-ink: #13221b; --c-ink-2: #5a6b63; --c-ink-3: #85948d;
  --c-brand: #1f6f50; --c-brand-strong: #17573f; --c-brand-soft: #e4f2eb; --c-on-brand: #ffffff;
  --c-warn: #8a5a00; --c-warn-soft: #fff4d9; --c-warn-bar: #e0a21b;
  --c-bad: #b3261e; --c-bad-soft: #fdeceb; --c-ok: #1b7f3b; --c-ok-soft: #e4f4e9;
  --c-scrim: rgba(12, 28, 21, .45); --c-focus: rgba(31, 111, 80, .35);
  --sh-1: 0 1px 2px rgba(16, 40, 30, .05), 0 1px 3px rgba(16, 40, 30, .07);
  --sh-2: 0 12px 32px rgba(16, 40, 30, .16);
  --s-1: 4px; --s-2: 6px; --s-3: 8px; --s-4: 12px; --s-5: 16px; --s-6: 20px; --s-7: 24px; --s-8: 32px;
  --s-thumb: 44px; --s-avatar-lg: 48px; --s-bar-lg: 12px; --w-search: 260px; --c-iss: #4f7fbf; --c-chip-count: rgba(255, 255, 255, .2); --s-mark: 34px; --s-avatar: 30px; --s-bar: 8px; --s-tap: 40px; --s-tap-sm: 32px; --s-input-cell: 36px; --s-ring: 3px; --s-icon: 18px;
  --w-page: 1200px; --w-dialog: 540px; --w-dialog-wide: 820px; --w-wcard: 280px; --w-kpi: 180px; --w-check: 20px;
  --t-xs: 11px; --t-sm: 13px; --t-base: 15px; --t-lg: 18px; --t-xl: 22px; --t-2xl: 28px; --t-tag: 12px; --s-print-cell: 3px;
  --c-print-ink: #000000; --c-print-bg: #ffffff;
  --r-sm: 8px; --r: 12px; --r-lg: 16px; --r-pill: 999px; --gap: 12px;
  --font: "Sarabun", "Leelawadee UI", "Tahoma", sans-serif;
  --bp-stack: 720px;
}
* { box-sizing: border-box; }
body { margin: 0; font: var(--t-base)/1.55 var(--font); background: var(--c-page); color: var(--c-ink); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; line-height: 1.3; }
h2 { font-size: var(--t-xl); }
h3 { font-size: var(--t-lg); }
svg.ic { width: var(--s-icon); height: var(--s-icon); flex: none; }

/* top bar */
header { position: sticky; top: 0; z-index: 5; background: var(--c-surface); border-bottom: 1px solid var(--c-line); }
.bar { max-width: var(--w-page); margin: 0 auto; padding: var(--s-3) var(--s-5); display: flex; gap: var(--gap); align-items: center; }
.mark { width: var(--s-mark); height: var(--s-mark); border-radius: var(--r-sm); background: var(--c-brand); color: var(--c-on-brand); display: grid; place-items: center; font-weight: 700; font-size: var(--t-lg); }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-size: var(--t-lg); }
.brand small { display: block; color: var(--c-ink-3); font-size: var(--t-xs); }
.who { display: flex; align-items: center; gap: var(--s-3); font-size: var(--t-sm); color: var(--c-ink-2); }
.who:empty { display: none; }
.avatar { width: var(--s-avatar); height: var(--s-avatar); border-radius: var(--r-pill); background: var(--c-brand-soft); color: var(--c-brand-strong); display: grid; place-items: center; font-weight: 700; }
.who b { display: block; color: var(--c-ink); font-weight: 600; }

main { max-width: var(--w-page); margin: 0 auto; padding: var(--s-6) var(--s-5) var(--s-8); }
.card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); padding: var(--s-6); margin-bottom: var(--s-5); box-shadow: var(--sh-1); }
.card-head { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap; margin-bottom: var(--s-4); }
.page-head { display: flex; gap: var(--gap); align-items: flex-end; flex-wrap: wrap; margin-bottom: var(--s-5); }
.page-head h2 { font-size: var(--t-2xl); }

/* controls */
button { font: inherit; font-size: var(--t-sm); font-weight: 600; min-height: var(--s-tap); display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  border-radius: var(--r-sm); border: 1px solid var(--c-line-strong); background: var(--c-surface); color: var(--c-ink); padding: 0 var(--s-4); cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s; }
button:hover { background: var(--c-surface-2); border-color: var(--c-ink-3); }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: none; box-shadow: 0 0 0 var(--s-ring) var(--c-focus); }
button.primary { background: var(--c-brand); color: var(--c-on-brand); border-color: var(--c-brand); }
button.primary:hover { background: var(--c-brand-strong); border-color: var(--c-brand-strong); }
button.danger { color: var(--c-bad); border-color: var(--c-line-strong); }
button.danger:hover { background: var(--c-bad-soft); border-color: var(--c-bad); }
button.ghost { border-color: transparent; background: transparent; color: var(--c-ink-2); }
button.ghost:hover { background: var(--c-surface-2); color: var(--c-ink); }
button { vertical-align: middle; }
button.sm { min-height: var(--s-tap-sm); height: var(--s-tap-sm); padding: 0 var(--s-3); }
button:disabled, button:disabled:hover { opacity: .45; cursor: not-allowed; background: var(--c-surface); }
button.primary:disabled, button.primary:disabled:hover { background: var(--c-brand); }
input, select { font: inherit; min-height: var(--s-tap); padding: var(--s-2) var(--s-4); border: 1px solid var(--c-line-strong); border-radius: var(--r-sm); width: 100%; background: var(--c-surface); color: var(--c-ink); margin-top: var(--s-1); }
input:focus, select:focus { border-color: var(--c-brand); }
input[type=checkbox], input[type=radio] { width: var(--w-check); height: var(--w-check); min-height: 0; margin: 0; accent-color: var(--c-brand); cursor: pointer; }
label { display: block; font-size: var(--t-sm); font-weight: 600; color: var(--c-ink-2); margin-top: var(--s-4); }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(var(--w-kpi), 1fr)); gap: var(--gap); margin-bottom: var(--s-5); }
.kpi { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r); padding: var(--s-4) var(--s-5); box-shadow: var(--sh-1); }
.kpi span { display: block; font-size: var(--t-sm); color: var(--c-ink-2); }
.kpi b { display: block; font-size: var(--t-xl); font-variant-numeric: tabular-nums; }
.kpi.alert b { color: var(--c-warn); }

/* wallet cards */
.wallets { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--w-wcard), 1fr)); gap: var(--s-5); }
.wcard { position: relative; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); padding: var(--s-5); box-shadow: var(--sh-1); display: flex; flex-direction: column; gap: var(--s-4); transition: box-shadow .15s, border-color .15s, transform .15s; }
.wcard:hover { box-shadow: var(--sh-2); border-color: var(--c-line-strong); transform: translateY(-1px); }
.wcard.closed { opacity: .65; }
.wtop { display: flex; gap: var(--s-3); align-items: flex-start; }
.wname { flex: 1; min-width: 0; }
.wname button { all: unset; cursor: pointer; font-size: var(--t-lg); font-weight: 700; color: var(--c-ink); }
.wname button::after { content: ""; position: absolute; inset: 0; border-radius: var(--r-lg); }
.wname button:focus-visible::after { box-shadow: 0 0 0 var(--s-ring) var(--c-focus); }
.wname small { display: block; color: var(--c-ink-3); font-size: var(--t-sm); }
.wtop .edit { position: relative; z-index: 1; }
.wbal span { display: block; font-size: var(--t-sm); color: var(--c-ink-2); }
.wbal b { font-size: var(--t-2xl); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.wbal em { font-style: normal; color: var(--c-ink-3); font-size: var(--t-sm); margin-left: var(--s-1); }
.meter { height: var(--s-bar); border-radius: var(--r-pill); background: var(--c-surface-2); border: 1px solid var(--c-line); overflow: hidden; }
.meter i { display: block; height: 100%; width: var(--p); background: var(--c-brand); border-radius: var(--r-pill); }
.meter.low i { background: var(--c-warn-bar); }
.meter.neg i { background: var(--c-bad); }
.wfoot .tag { flex: none; }
.wfoot { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; font-size: var(--t-sm); color: var(--c-ink-2); border-top: 1px solid var(--c-line); padding-top: var(--s-4); }

/* tags */
.tag { display: inline-flex; align-items: center; font-size: var(--t-tag); font-weight: 600; padding: 1px var(--s-3); border-radius: var(--r-pill); background: var(--c-surface-2); color: var(--c-ink-2); border: 1px solid var(--c-line); margin-right: var(--s-1); white-space: nowrap; }
.tag.warn { background: var(--c-warn-soft); color: var(--c-warn); border-color: transparent; }
.tag.bad { background: var(--c-bad-soft); color: var(--c-bad); border-color: transparent; }
.tag.ok { background: var(--c-ok-soft); color: var(--c-ok); border-color: transparent; }
.tag.brand { background: var(--c-brand-soft); color: var(--c-brand-strong); border-color: transparent; }

/* wallet detail */
.back { margin-bottom: var(--s-4); margin-left: calc(var(--s-3) * -1); }
.hero { display: grid; grid-template-columns: 1fr auto; gap: var(--s-5); align-items: end; }
.hero .stats { display: flex; gap: var(--s-7); flex-wrap: wrap; }
.hero .stats span { display: block; font-size: var(--t-sm); color: var(--c-ink-2); }
.hero .stats b { font-size: var(--t-xl); font-variant-numeric: tabular-nums; }
.hero .stats .main b { font-size: var(--t-2xl); }
.hero .meter { grid-column: 1 / -1; }
.count { font-size: var(--t-sm); color: var(--c-ink-3); font-weight: 400; margin-left: var(--s-2); }

table { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: var(--s-4) var(--s-3); border-bottom: 1px solid var(--c-line); vertical-align: middle; }
thead th { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .03em; color: var(--c-ink-3); font-weight: 600; background: var(--c-surface-2); border-bottom: 1px solid var(--c-line); }
thead th:first-child { border-top-left-radius: var(--r-sm); }
thead th:last-child { border-top-right-radius: var(--r-sm); }
tbody tr { transition: background .1s; }
tbody tr:hover { background: var(--c-surface-2); }
tbody tr.on { background: var(--c-brand-soft); }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.amt { font-weight: 700; }
td.act { white-space: nowrap; text-align: right; }
td.act button + button { margin-left: var(--s-1); }
td input { margin: 0; min-height: var(--s-input-cell); }
.neg { color: var(--c-bad); }
.desc { font-weight: 600; }
.desc + div { margin-top: var(--s-1); }
.row { display: flex; gap: var(--gap); flex-wrap: wrap; align-items: center; }
.grow { flex: 1; }
.muted { color: var(--c-ink-2); font-size: var(--t-sm); }
.empty { text-align: center; padding: var(--s-8) var(--s-5); color: var(--c-ink-2); }
.empty b { display: block; color: var(--c-ink); font-size: var(--t-lg); margin-bottom: var(--s-1); }
.thumbs { white-space: nowrap; }
.thumbs img { width: var(--s-thumb); height: var(--s-thumb); object-fit: cover; border-radius: var(--r-sm); margin-right: var(--s-1); cursor: zoom-in; background: var(--c-surface-2); border: 1px solid var(--c-line); vertical-align: middle; }
.scroll { overflow-x: auto; }
.selbar { position: sticky; bottom: var(--s-4); z-index: 2; margin-top: var(--s-4); display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap;
  background: var(--c-ink); color: var(--c-surface); border-radius: var(--r); padding: var(--s-3) var(--s-3) var(--s-3) var(--s-5); box-shadow: var(--sh-2); }
.selbar #selSum { color: var(--c-surface); }
.selbar #selSum:empty::before { content: "ติ๊กรายการที่จะรวมเป็นใบเคลียร์"; opacity: .7; }

dialog { border: 0; border-radius: var(--r-lg); padding: var(--s-7); width: min(var(--w-dialog), 94vw); box-shadow: var(--sh-2); color: var(--c-ink); }
dialog.wide { width: min(var(--w-dialog-wide), 94vw); }
dialog::backdrop { background: var(--c-scrim); }
dialog h3 { font-size: var(--t-xl); margin-bottom: var(--s-2); }
dialog .note { background: var(--c-surface-2); border: 1px solid var(--c-line); border-radius: var(--r-sm); padding: var(--s-3) var(--s-4); margin: var(--s-3) 0 0; }
dialog .foot { display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap; margin-top: var(--s-7); }
dialog img.full { max-width: 100%; border-radius: var(--r-sm); display: block; margin-bottom: var(--s-4); }
#msg { position: fixed; bottom: var(--s-6); left: 50%; transform: translateX(-50%); z-index: 10; background: var(--c-ink); color: var(--c-surface); padding: var(--s-3) var(--s-5); border-radius: var(--r-pill); box-shadow: var(--sh-2); font-size: var(--t-sm); display: none; max-width: 92vw; }
#print { display: none; }
.mt { margin-top: var(--s-4); }

/* wallet summary */
.summary { display: grid; gap: var(--s-5); }
.sum-id { display: flex; gap: var(--s-4); align-items: center; }
.sum-id p { margin: 0; }
.avatar.lg { width: var(--s-avatar-lg); height: var(--s-avatar-lg); font-size: var(--t-xl); flex: none; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
.tile { background: var(--c-surface-2); border: 1px solid var(--c-line); border-radius: var(--r); padding: var(--s-4) var(--s-5); }
.tile span { display: flex; align-items: center; gap: var(--s-2); font-size: var(--t-sm); color: var(--c-ink-2); }
.tile b { display: block; font-size: var(--t-xl); font-variant-numeric: tabular-nums; margin-top: var(--s-1); }
.tile.hl { background: var(--c-brand); border-color: var(--c-brand); }
.tile.hl span, .tile.hl b { color: var(--c-on-brand); }
.tile.hl b { font-size: var(--t-2xl); line-height: 1.2; }
.tile.hl.low { background: var(--c-warn-soft); border-color: var(--c-warn-bar); }
.tile.hl.low span, .tile.hl.low b { color: var(--c-warn); }
.tile.hl.neg { background: var(--c-bad-soft); border-color: var(--c-bad); }
.tile.hl.neg span, .tile.hl.neg b { color: var(--c-bad); }
.dot { width: var(--s-3); height: var(--s-3); border-radius: var(--r-pill); display: inline-block; }
.dot.pend, .stackbar .pend { background: var(--c-warn-bar); }
.dot.iss, .stackbar .iss { background: var(--c-iss); }
.stackbar .adj { background: var(--c-line-strong); }
.stackbar { display: flex; height: var(--s-bar-lg); border-radius: var(--r-pill); background: var(--c-brand); overflow: hidden; }
.stackbar i { display: block; width: var(--p); }
.sum-note { margin: calc(var(--s-3) * -1) 0 0; }

/* filters */
.filters { display: flex; gap: var(--s-3) var(--s-4); flex-wrap: wrap; align-items: center; margin-bottom: var(--s-4); }
.search { position: relative; flex: 1 1 var(--w-search); margin: 0; font-weight: 400; }
.search svg { position: absolute; left: var(--s-4); top: 50%; transform: translateY(-50%); color: var(--c-ink-3); }
.search input { margin: 0; padding-left: var(--s-8); border-radius: var(--r-pill); background: var(--c-surface-2); }
.search input:focus { background: var(--c-surface); }
.chips { display: flex; gap: var(--s-2); flex-wrap: wrap; }
.chip { min-height: var(--s-tap-sm); border-radius: var(--r-pill); padding: 0 var(--s-4); font-weight: 600; color: var(--c-ink-2); }
.chip span { font-size: var(--t-xs); background: var(--c-surface-2); color: var(--c-ink-2); border-radius: var(--r-pill); padding: 0 var(--s-2); }
.chip[aria-pressed="true"] { background: var(--c-ink); border-color: var(--c-ink); color: var(--c-surface); }
.chip[aria-pressed="true"] span { background: var(--c-chip-count); color: var(--c-surface); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.note-line { display: flex; gap: var(--s-2); align-items: flex-start; margin-top: var(--s-2); font-size: var(--t-sm); color: var(--c-ink-2); background: var(--c-warn-soft); border-radius: var(--r-sm); padding: var(--s-1) var(--s-3); }
.radios { border: 0; padding: 0; margin: var(--s-4) 0 0; display: flex; gap: var(--s-5); flex-wrap: wrap; }
.radios legend { font-size: var(--t-sm); font-weight: 600; color: var(--c-ink-2); padding: 0; margin-bottom: var(--s-1); }
.radios label { display: inline-flex; align-items: center; gap: var(--s-2); margin: 0; min-height: var(--s-tap); font-weight: 400; color: var(--c-ink); cursor: pointer; }
.adj-void td { color: var(--c-ink-3); }
.adj-void .amt { text-decoration: line-through; }
.amt.plus { color: var(--c-ok); }
.amt.minus { color: var(--c-bad); }
.sum-extra { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-2); }
.note-line svg { width: var(--s-5); height: var(--s-5); margin-top: var(--s-1); color: var(--c-warn); }
textarea { font: inherit; width: 100%; padding: var(--s-3) var(--s-4); border: 1px solid var(--c-line-strong); border-radius: var(--r-sm); margin-top: var(--s-1); resize: vertical; color: var(--c-ink); background: var(--c-surface); }
textarea:focus { border-color: var(--c-brand); outline: none; box-shadow: 0 0 0 var(--s-ring) var(--c-focus); }
tr[hidden] { display: none !important; }

/* phones: tables become stacked rows, labels come from data-label */
@media (max-width: 720px) {
  main { padding: var(--s-4) var(--s-3) var(--s-8); }
  .card { padding: var(--s-4); border-radius: var(--r); }
  .page-head h2 { font-size: var(--t-xl); }
  .page-head > .grow { flex-basis: 100%; }
  .who span { display: none; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .tile.hl { grid-column: 1 / -1; }
  .hero .stats { gap: var(--s-5); }
  table.stack thead { display: none; }
  table.stack tr { display: grid; grid-template-columns: auto 1fr; gap: var(--s-1) var(--s-4); padding: var(--s-4) 0; border-bottom: 1px solid var(--c-line); }
  table.stack td { border: 0; padding: 0; text-align: left; }
  table.stack td[data-label]::before { content: attr(data-label); display: block; font-size: var(--t-xs); color: var(--c-ink-3); }
  table.stack td.sel { grid-row: span 2; }
  table.stack td.full, table.stack td.act { grid-column: 1 / -1; text-align: left; }
  table.stack td.num { text-align: left; }
}

@media print {
  body { background: var(--c-print-bg); }
  header, main, #msg, dialog { display: none !important; }
  #print { display: block; }
  .page { page-break-after: always; padding: 10mm 12mm; font-size: var(--t-xs); color: var(--c-print-ink); }
  .page:last-child { page-break-after: auto; }
  .page table { border: 1px solid var(--c-print-ink); border-collapse: collapse; }
  .page th, .page td { border: 1px solid var(--c-print-ink); padding: var(--s-print-cell) var(--s-1); color: var(--c-print-ink); background: var(--c-print-bg); text-transform: none; letter-spacing: 0; font-size: var(--t-xs); border-radius: 0; }
  .page .head { display: flex; justify-content: space-between; margin-bottom: var(--s-2); }
  .page .box { display: inline-block; width: var(--s-4); height: var(--s-4); border: 1px solid var(--c-print-ink); text-align: center; line-height: var(--t-xs); margin-right: var(--s-2); }
  .page .sign { display: flex; justify-content: space-around; margin-top: 30mm; text-align: center; }
  .page .photo { height: 120mm; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .page .photo img { max-height: 110mm; max-width: 100%; }
}
/* ds-allow-hardcode: F-AC#101 is the company's fixed A4 form; data sits on the original artwork at its PDF coordinates (pt) */
@page { size: A4; margin: 0; }
@media print {
  .form { position: relative; width: 595.32pt; height: 841.92pt; overflow: hidden; page-break-after: always; color: var(--c-print-ink); font-size: 7.5pt; }
  .form:last-child { page-break-after: auto; }
  .form > img { position: absolute; left: 0; top: 0; width: 595.32pt; height: 841.92pt; }
  .form .f { position: absolute; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .form .f.c { text-align: center; } .form .f.r { text-align: right; padding-right: 3pt; } .form .f.l { padding-left: 3pt; }
  .form .tick { position: absolute; left: 33pt; top: 101.8pt; width: 10.5pt; height: 8.9pt; }
  .form .pg { position: absolute; left: 24.6pt; top: 812.3pt; font-size: 7pt; }
}
/* end ds-allow-hardcode */
</style>
</head>
<body>
<header><div class="bar"><div class="mark" aria-hidden="true">฿</div><div class="brand"><h1>เงินสดย่อย</h1><small>Job Tracker</small></div><div class="who" id="who"></div></div></header>
<main id="app"><div class="card">กำลังโหลด…</div></main>
<div id="print"></div>
<dialog id="dlg"></dialog>
<div id="msg" role="status"></div>
<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://ilqjobhohgwetfnhmxxz.supabase.co';
  var STORE_KEY = 'pc-session';
  var VOUCHER_FORM = 'F-AC#103'; // DocGen form for each expense voucher (เบิกค่าใช้จ่าย)
  var CLEARING_FORM = 'F-AC#101';
  var ROWS_PER_PAGE = 27; // rows printed on F-AC#101
  var PHOTO_CONCURRENCY = 4; // each photo is a Job Tracker (Apps Script) call; GAS throttles many at once
  var S = { sess: null, staff: null, wallets: [], wallet: null, payments: [], clearings: [], settings: {}, sel: {}, f: { pay: 'all', payQ: '', cl: 'all', clQ: '' } };
  var app = document.getElementById('app');

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function baht(n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function dmy(iso) {
    if (!iso) return '';
    var d = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? new Date(iso + 'T00:00:00+07:00') : new Date(iso);
    var b = new Date(d.getTime() + 7 * 3600 * 1000);
    var two = function (n) { return (n < 10 ? '0' : '') + n; }; // fixed width so dates line up in columns
    return two(b.getUTCDate()) + '/' + two(b.getUTCMonth() + 1) + '/' + b.getUTCFullYear();
  }
  function svg(d) { return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>'; }
  var ICON = {
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    gear: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
    edit: svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
    search: svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'),
    note: svg('<path d="M4 4h16v12H8l-4 4z"/>'),
    back: svg('<path d="M15 18l-6-6 6-6"/>'),
    doc: svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>'),
    print: svg('<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/>')
  };
  // balance bar: amber below the low-balance setting, red when the custodian is paying from their own pocket
  function meter(balance, limit) {
    var pct = limit > 0 ? Math.max(0, Math.min(100, balance / limit * 100)) : 0;
    var cls = balance < 0 ? ' neg' : pct < Number(S.settings.low_pct || 20) ? ' low' : '';
    return '<div class="meter' + cls + '" role="img" aria-label="คงเหลือ ' + Math.round(pct) + '% ของวงเงิน"><i style="--p:' + (balance < 0 ? 100 : pct).toFixed(1) + '%"></i></div>';
  }
  function toast(t) { var m = document.getElementById('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { m.style.display = 'none'; }, 3500); }

  function api(action, body) {
    var headers = { 'Content-Type': 'application/json' };
    if (S.sess) headers['x-pc-session'] = S.sess;
    return fetch(SUPABASE_URL + '/functions/v1/pc-api', { method: 'POST', headers: headers, body: JSON.stringify(Object.assign({ action: action }, body || {})) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, data: d }; }); })
      .then(function (r) {
        if (r.status === 401 && action !== 'session') { try { sessionStorage.removeItem(STORE_KEY); } catch (e) { /* storage blocked */ } throw new Error('หมดเวลาใช้งาน กรุณาเปิดจากเมนู "เงินสดย่อย" ใน Job Tracker อีกครั้ง'); }
        if (r.status !== 200) throw new Error((r.data && r.data.error) || 'ระบบขัดข้อง กรุณาลองใหม่');
        return r.data;
      });
  }
  function fail(e) { toast(e.message || String(e)); }

  // Photo loader: at most PHOTO_CONCURRENCY requests in flight, the rest wait in line.
  var photoQueue = [], photoBusy = 0;
  function photo(id, thumb) {
    return new Promise(function (resolve, reject) {
      photoQueue.push({ id: id, thumb: !!thumb, resolve: resolve, reject: reject });
      pumpPhotos();
    });
  }
  function pumpPhotos() {
    while (photoBusy < PHOTO_CONCURRENCY && photoQueue.length) {
      var job = photoQueue.shift();
      photoBusy++;
      api('photo', { id: job.id, thumb: job.thumb })
        .then(function (d) { return 'data:' + d.mime + ';base64,' + d.b64; })
        .then(job.resolve, job.reject)
        .then(function () { photoBusy--; pumpPhotos(); });
    }
  }

  function docgenUrl(form) {
    var base = String(S.settings.docgen_url || '');
    if (!base) return '';
    return base + (base.indexOf('?') === -1 ? '?' : '&') + 'unit=' + encodeURIComponent(S.staff.unit) + '&who=' + encodeURIComponent(S.staff.n) + '&form=' + encodeURIComponent(form);
  }
  function openDocgen(form) {
    var u = docgenUrl(form);
    if (!u) return toast('ยังไม่ได้ตั้งลิงก์ DocGen ในหน้าตั้งค่า');
    window.open(u, '_blank', 'noopener');
  }

  // ---------- wallets ----------
  function home() {
    S.wallet = null;
    return api('wallets').then(function (d) {
      S.wallets = d.wallets || [];
      var setter = S.staff.role === 'setter';
      var open = S.wallets.filter(function (w) { return w.status !== 'closed'; });
      var total = function (k) { return open.reduce(function (s, w) { return s + Number(w[k] || 0); }, 0); };
      var flagged = total('flagged');
      var cards = S.wallets.map(function (w) {
        return '<article class="wcard' + (w.status === 'closed' ? ' closed' : '') + '"><div class="wtop"><div class="wname">' +
          '<button type="button" data-open="' + w.id + '">' + esc(w.custodian_name) + '</button>' +
          '<small>' + esc(w.unit_code || 'ไม่ระบุหน่วยงาน') + (w.status === 'closed' ? ' · ปิดแล้ว' : '') + '</small></div>' +
          (setter ? '<button type="button" class="ghost sm edit" data-edit="' + w.id + '" aria-label="แก้ไขกระเป๋า ' + esc(w.custodian_name) + '">' + ICON.edit + '</button>' : '') + '</div>' +
          '<div class="wbal"><span>คงเหลือ</span><b class="' + (w.balance < 0 ? 'neg' : '') + '">' + baht(w.balance) + '</b><em>/ ' + baht(w.limit_amount) + '</em></div>' +
          meter(w.balance, w.limit_amount) +
          '<div class="wfoot">' + (w.pending_count ? '<span class="tag brand">รอเคลียร์ ' + w.pending_count + ' รายการ</span>' : '<span class="tag">ไม่มีรายการค้าง</span>') +
          (w.flagged ? '<span class="tag warn">ต้องตรวจ ' + w.flagged + '</span>' : '') +
          (w.outstanding ? '<span class="grow"></span><span>ใช้ไป ' + baht(w.outstanding) + '</span>' : '') + '</div></article>';
      }).join('');
      app.innerHTML = '<div class="page-head"><div class="grow"><h2>กระเป๋าเงินสดย่อย</h2><p class="muted">' + open.length + ' กระเป๋าที่เปิดอยู่</p></div>' +
        (setter ? '<button type="button" id="btnSettings">' + ICON.gear + 'ตั้งค่า</button><button type="button" id="btnNew" class="primary">' + ICON.plus + 'ตั้งกระเป๋าใหม่</button>' : '') + '</div>' +
        (cards ? '<div class="kpis"><div class="kpi"><span>วงเงินรวม</span><b>' + baht(total('limit_amount')) + '</b></div>' +
          '<div class="kpi"><span>คงเหลือรวม</span><b>' + baht(total('balance')) + '</b></div>' +
          '<div class="kpi"><span>รายการรอเคลียร์</span><b>' + total('pending_count') + '</b></div>' +
          '<div class="kpi' + (flagged ? ' alert' : '') + '"><span>ต้องตรวจ</span><b>' + flagged + '</b></div></div>' +
          '<div class="wallets">' + cards + '</div>'
          : '<div class="card empty"><b>ยังไม่มีกระเป๋า</b>' + (setter ? 'กด "ตั้งกระเป๋าใหม่" เพื่อเริ่ม' : 'ยังไม่มีกระเป๋าที่คุณดูแล') + '</div>');
      app.querySelectorAll('[data-open]').forEach(function (b) { b.onclick = function () { openWallet(Number(b.dataset.open)); }; });
      app.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { walletForm(S.wallets.find(function (w) { return w.id === Number(b.dataset.edit); })); }; });
      var n = document.getElementById('btnNew'); if (n) n.onclick = function () { walletForm(null); };
      var st = document.getElementById('btnSettings'); if (st) st.onclick = settingsForm;
    }).catch(fail);
  }

  function walletForm(w) {
    api('people').then(function (d) {
      var opts = (d.people || []).map(function (p) {
        return '<option value="' + esc(p.username) + '" data-unit="' + esc(p.unit_code || '') + '"' + (w && w.custodian === p.username ? ' selected' : '') + '>' + esc(p.name || p.username) + ' (' + esc(p.username) + ')' + (p.line_user_id ? '' : ' - ยังไม่ผูก LINE') + '</option>';
      }).join('');
      dialog('<h3>' + (w ? 'แก้ไขกระเป๋า' : 'ตั้งกระเป๋าใหม่') + '</h3>' +
        '<label>ผู้รักษาเงินสดย่อย<select id="fCust"' + (w ? ' disabled' : '') + '><option value="">เลือก</option>' + opts + '</select></label>' + // ds-allow-native-select: keyboard and screen-reader friendly on branch Chromium 109
        '<label>รหัสพนักงาน<input id="fEmp" value="' + esc(w ? w.employee_code || '' : '') + '"></label>' +
        '<label>รหัสหน่วยงาน (ใช้ขอเลขเอกสาร)<input id="fUnit" value="' + esc(w ? w.unit_code || '' : '') + '"></label>' +
        '<label>วงเงิน (บาท)<input id="fLimit" type="number" min="1" step="0.01" value="' + esc(w ? w.limit_amount : '') + '"></label>' +
        '<label>แอดมินผู้ดูแล (username คั่นด้วยจุลภาค)<input id="fAdmins" value="' + esc(w ? (w.admins || []).join(', ') : '') + '"></label>' +
        '<div class="foot">' + (w && w.status === 'open' ? '<button type="button" class="danger" id="fClose">ปิดกระเป๋า</button>' : '') +
        '<span class="grow"></span><button type="button" data-close>ยกเลิก</button><button type="button" class="primary" id="fSave">บันทึก</button></div>');
      var sel = document.getElementById('fCust');
      sel.onchange = function () { var o = sel.selectedOptions[0]; if (o && !document.getElementById('fUnit').value) document.getElementById('fUnit').value = o.dataset.unit || ''; };
      document.getElementById('fSave').onclick = function () {
        api('wallet_save', {
          id: w ? w.id : undefined, custodian: w ? w.custodian : sel.value, employeeCode: val('fEmp'), unitCode: val('fUnit'),
          limit: Number(val('fLimit')), admins: val('fAdmins').split(/[\s,]+/).filter(Boolean)
        }).then(function () { closeDialog(); toast('บันทึกแล้ว'); home(); }).catch(fail);
      };
      var c = document.getElementById('fClose');
      if (c) c.onclick = function () {
        if (!confirm('ปิดกระเป๋านี้? ปิดแล้วผู้รักษาเงินสดย่อยจะสั่ง "จ่าย" ไม่ได้อีก')) return;
        api('wallet_close', { id: w.id }).then(function () { closeDialog(); toast('ปิดกระเป๋าแล้ว'); home(); }).catch(fail);
      };
    }).catch(fail);
  }

  function settingsForm() {
    var s = S.settings;
    dialog('<h3>ตั้งค่า</h3>' +
      '<label>วันที่ส่ง LINE เตือนแอดมิน (คั่นด้วยจุลภาค)<input id="sDays" value="' + esc(s.remind_days || '10,20,25') + '"></label>' +
      '<label>เตือนเมื่อยอดคงเหลือต่ำกว่า (% ของวงเงิน)<input id="sLow" type="number" min="0" max="100" value="' + esc(s.low_pct || '20') + '"></label>' +
      '<label>เตือนเมื่อออกใบเคลียร์แล้วยังไม่โอนเกิน (วัน)<input id="sUnpaid" type="number" min="0" max="100" value="' + esc(s.unpaid_days || '7') + '"></label>' +
      '<label>ลิงก์ระบบ DocGen (ใช้ขอเลขที่เอกสาร)<input id="sDocgen" value="' + esc(s.docgen_url || '') + '"></label>' +
      '<div class="foot"><span class="grow"></span><button type="button" data-close>ยกเลิก</button><button type="button" class="primary" id="sSave">บันทึก</button></div>');
    document.getElementById('sSave').onclick = function () {
      api('settings_save', { remind_days: val('sDays'), low_pct: Number(val('sLow')), unpaid_days: Number(val('sUnpaid')), docgen_url: val('sDocgen') })
        .then(function () { return loadSettings(); }).then(function () { closeDialog(); toast('บันทึกแล้ว'); }).catch(fail);
    };
  }

  // ---------- one wallet ----------
  function openWallet(id) {
    if (!S.wallet || S.wallet.id !== id) S.f = { pay: 'all', payQ: '', cl: 'all', clQ: '' };
    S.wallet = S.wallets.find(function (w) { return w.id === id; });
    S.sel = {};
    // reload the wallet list too so the summary never shows totals from an older page load
    return Promise.all([api('payments', { walletId: id }), api('wallets')]).then(function (r) {
      var d = r[0];
      S.wallets = r[1].wallets || S.wallets;
      S.wallet = S.wallets.find(function (w) { return w.id === id; }) || S.wallet;
      S.payments = d.payments || [];
      S.clearings = d.clearings || [];
      S.adjustments = d.adjustments || [];
      renderWallet();
    }).catch(fail);
  }

  // setters adjust cash on hand (opening balance, interest); adjustments are never cleared, a wrong one is voided
  var ADJ = { opening: 'ยอดยกมา', interest: 'ดอกเบี้ย', interest_return: 'โอนดอกเบี้ยคืนบริษัท', other: 'อื่น ๆ' };
  var signed = function (n) { n = Number(n); return (n > 0 ? '+' : '-') + baht(Math.abs(n)); };
  function adjustForm() {
    var w = S.wallet;
    dialog('<h3>ปรับยอดคงเหลือ</h3>' +
      '<p class="muted note">ใช้เมื่อเงินในมือผู้รักษาเงินสดย่อยเปลี่ยนโดยไม่ใช่รายการจ่าย เช่น ยอดยกมาวันเริ่มใช้ระบบ หรือได้ดอกเบี้ย ยอดที่ปรับจะไม่ถูกเคลียร์ และผู้รักษาเงินสดย่อยจะได้รับแจ้งทาง LINE</p>' +
      '<label>ประเภท<select id="aKind">' + Object.keys(ADJ).map(function (k) { return '<option value="' + k + '">' + ADJ[k] + '</option>'; }).join('') + '</select></label>' + // ds-allow-native-select: keyboard and screen-reader friendly on branch Chromium 109
      '<fieldset id="aSignBox" class="radios"><legend>ปรับ</legend>' +
        '<label><input type="radio" name="aSign" value="out" checked> ลดยอด</label><label><input type="radio" name="aSign" value="in"> เพิ่มยอด</label></fieldset>' +
      '<label>จำนวนเงิน (บาท)<input id="aAmt" type="number" min="0.01" step="0.01" inputmode="decimal"></label>' +
      '<label>เหตุผล<textarea id="aReason" rows="2" maxlength="300" placeholder="เช่น เงินในมือวันเริ่มใช้ระบบ 3,200 บาท"></textarea></label>' +
      '<p class="muted" id="aPreview" aria-live="polite"></p>' +
      '<div class="foot"><span class="grow"></span><button type="button" data-close>ยกเลิก</button><button type="button" class="primary" id="aSave">บันทึก</button></div>');
    var kind = document.getElementById('aKind'), box = document.getElementById('aSignBox');
    var sign = function () {
      if (kind.value === 'interest') return 1;
      if (kind.value === 'interest_return') return -1;
      return document.querySelector('input[name="aSign"]:checked').value === 'in' ? 1 : -1;
    };
    var preview = function () {
      box.hidden = kind.value === 'interest' || kind.value === 'interest_return';
      var a = Math.round(Number(val('aAmt')) * 100) / 100;
      document.getElementById('aPreview').textContent = a > 0
        ? 'ปรับ ' + signed(sign() * a) + ' บาท คงเหลือจะเป็น ' + baht(Number(w.balance) + sign() * a) + ' บาท' : '';
    };
    kind.onchange = preview;
    document.getElementById('aAmt').oninput = preview;
    box.onchange = preview;
    preview();
    document.getElementById('aSave').onclick = function () {
      api('adjust_create', { walletId: w.id, kind: kind.value, amount: Number(val('aAmt')), sign: sign() > 0 ? 'in' : 'out', reason: val('aReason') })
        .then(function () { closeDialog(); toast('ปรับยอดแล้ว'); refresh(); }).catch(fail);
    };
  }

  var FLAG = { mismatch: ['ยอดไม่ตรง', 'warn'], duplicate: ['อาจซ้ำ', 'bad'] };
  var EVIDENCE = { receipt: 'ใบกำกับภาษี/ใบเสร็จ', substitute: 'ใบแทนใบเสร็จ' };

  // filter groups: each row carries data-g (space-separated groups) and data-q (search text)
  var PAY_FILTERS = [['all', 'ทั้งหมด'], ['novoucher', 'ยังไม่มีเลขใบเบิก'], ['flag', 'ต้องตรวจ'], ['awaiting', 'รอยืนยัน'], ['noted', 'มีหมายเหตุ']];
  var CL_FILTERS = [['all', 'ทั้งหมด'], ['issued', 'รอโอน'], ['reimbursed', 'โอนแล้ว'], ['cancelled', 'ยกเลิก']];
  var CL_TAG = { issued: '<span class="tag warn">รอโอน</span>', reimbursed: '<span class="tag ok">โอนแล้ว</span>', cancelled: '<span class="tag">ยกเลิกแล้ว</span>' };
  function chips(key, list, rows) {
    return '<div class="chips" role="group" aria-label="กรองรายการ">' + list.map(function (f) {
      var n = f[0] === 'all' ? rows.length : rows.filter(function (g) { return g.indexOf(f[0]) !== -1; }).length;
      return '<button type="button" class="chip" data-chip="' + key + '" data-v="' + f[0] + '" aria-pressed="' + (S.f[key] === f[0]) + '">' + f[1] + '<span>' + n + '</span></button>';
    }).join('') + '</div>';
  }
  function searchBox(key, ph) {
    return '<label class="search"><span class="sr">ค้นหา</span>' + ICON.search + '<input type="search" data-search="' + key + '" placeholder="' + ph + '" value="' + esc(S.f[key + 'Q']) + '"></label>';
  }
  function applyFilter(key) {
    var g = S.f[key], q = String(S.f[key + 'Q'] || '').trim().toLowerCase(), shown = 0;
    app.querySelectorAll('[data-list="' + key + '"] tbody tr').forEach(function (tr) {
      var ok = (g === 'all' || tr.dataset.g.split(' ').indexOf(g) !== -1) && (!q || tr.dataset.q.indexOf(q) !== -1);
      tr.hidden = !ok;
      if (ok) shown++;
    });
    var none = app.querySelector('[data-none="' + key + '"]');
    if (none) none.hidden = shown > 0;
    app.querySelectorAll('[data-chip="' + key + '"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === g)); });
    if (key === 'pay') syncAll();
  }
  // header checkbox reflects the visible, selectable rows only
  function syncAll() {
    var all = document.getElementById('selAll');
    if (!all) return;
    var vis = [].filter.call(app.querySelectorAll('[data-sel]'), function (c) { return !c.closest('tr').hidden; });
    var on = vis.filter(function (c) { return c.checked; }).length;
    all.checked = vis.length > 0 && on === vis.length;
    all.indeterminate = on > 0 && on < vis.length;

  function selected() { return S.payments.filter(function (p) { return S.sel[p.id] && p.status === 'pending'; }); }
  function updateSel() {
    var sel = selected();
    var sum = sel.reduce(function (s, p) { return s + Number(p.amount); }, 0);
    var missing = sel.filter(function (p) { return !p.voucher_no; }).length;
    document.getElementById('selSum').textContent = sel.length ? 'เลือก ' + sel.length + ' รายการ ' + baht(sum) + ' บาท' + (missing ? ' · ขาดเลขที่ใบเบิก ' + missing + ' รายการ' : '') : '';
    document.getElementById('btnClear').disabled = !sel.length || missing > 0;
  }

  function createClearing() {
    var ids = selected().map(function (p) { return p.id; });
    if (!confirm('ออกใบเคลียร์ ' + ids.length + ' รายการ? รายการที่เลือกจะแก้ไขไม่ได้อีก')) return;
    api('clearing_create', { walletId: S.wallet.id, ids: ids }).then(function (d) {
      toast('ออกใบเคลียร์แล้ว');
      return refreshAll().then(function () { printClearing(d.id); });
    }).catch(fail);
  }

    dialog(head + '<div class="scroll"><table><thead><tr><th>ลำดับ</th><th>วันที่จ่าย</th><th>เลขที่ใบเบิก</th><th>รายการ</th><th>หลักฐาน</th><th class="num">จำนวนเงิน</th></tr></thead><tbody>' +
      items.map(function (p, k) {
        return '<tr><td>' + (k + 1) + '</td><td>' + dmy(p.ai_date || p.created_at) + '</td><td>' + esc(p.voucher_no || '-') + '</td><td>' + esc(p.description) + '</td><td class="muted">' + esc(EVIDENCE[p.evidence_type] || '-') + '</td><td class="num amt">' + baht(p.amount) + '</td></tr>';
      }).join('') +
      '<tr><td colspan="5"><b>รวม ' + items.length + ' รายการ</b></td><td class="num amt"><b>' + baht(c.total) + '</b></td></tr></tbody></table></div>' +
      '<div class="foot">' + (c.status === 'issued' ? '<button type="button" class="danger" id="cCancel">ยกเลิกใบเคลียร์</button>' : '<span class="muted">โอนแล้ว ยกเลิกไม่ได้</span>') +
      '<span class="grow"></span><button type="button" data-close>ปิด</button><button type="button" class="primary" id="cPrint">' + ICON.print + 'พิมพ์</button></div>', true);
    document.getElementById('cPrint').onclick = function () { closeDialog(); printClearing(id); };
    var x = document.getElementById('cCancel');
    if (x) x.onclick = function () {
      var reason = prompt('เหตุผลที่ยกเลิกใบเคลียร์นี้ (รายการทั้ง ' + items.length + ' รายการจะกลับไปที่ "รายการรอเคลียร์" ให้เลือกใหม่ได้)');
      if (reason === null) return;
      if (!reason.trim()) { toast('กรุณาระบุเหตุผลที่ยกเลิก'); return; }
      api('clearing_cancel', { id: id, reason: reason }).then(function () { closeDialog(); toast('ยกเลิกใบเคลียร์แล้ว รายการกลับไปรอเคลียร์'); refreshAll(); }).catch(fail);
    };
  }

  // ---------- F-AC#101 print view ----------
  function printClearing(id) {
    var c = S.clearings.find(function (x) { return x.id === id; });
    var w = S.wallet;
    var items = S.payments.filter(function (p) { return p.clearing_id === id; });
    var pages = [];
    for (var i = 0; i < Math.max(items.length, 1); i += ROWS_PER_PAGE) pages.push(items.slice(i, i + ROWS_PER_PAGE));
    var sum = function (t) { return items.filter(function (p) { return t === null ? true : p.evidence_type === t; }).reduce(function (s, p) { return s + Number(p.amount); }, 0); };
    var cell = function (p, t) { return p.evidence_type === t ? baht(p.amount) : '-'; };
    // F-AC#101 V.001-11-2024: the original artwork (fac101.svg, from the company PDF) with the data placed at its PDF coordinates in pt
    var put = function (x, y, w, h, text, cls) {
      return '<span class="f ' + (cls || '') + '" style="left:' + x + 'pt;top:' + y + 'pt;width:' + w + 'pt;height:' + h + 'pt;line-height:' + h + 'pt">' + esc(text) + '</span>';
    };
    var COLS = [[24.4, 28.3, 'c'], [53.2, 76.8, 'c'], [130.5, 76.8, 'c'], [207.8, 151.6, 'l'], [359.8, 77.3, 'r'], [437.6, 60.5, 'r'], [498.6, 49.8, 'r']];
    var ROW_TOP = 184.6, ROW_H = (592.6 - 184.6) / ROWS_PER_PAGE;
    // header values sit 2pt above the form's dotted lines so the dots stay visible
    var docNo = String(c.doc_no || '').replace(/^F-AC#101\//, '');
    var html = pages.map(function (rows, pi) {
      var last = pi === pages.length - 1;
      return '<div class="form"><img alt="" src="fac101.svg">' +
        '<svg class="tick" viewBox="0 0 10 9" aria-hidden="true"><path d="M2 4.6l2.2 2.4L8.4 1.8" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>' +
        put(489, 82.5, 89, 10.9, docNo) + put(262, 98, 93, 10.9, w.custodian_name) + put(456, 98.7, 118, 10.9, dmy(c.created_at)) +
        put(97, 116.7, 76, 10.9, baht(w.limit_amount), 'c') +
        put(84, 135.7, 90, 10.9, w.custodian_name) + put(241, 135.7, 108, 10.9, w.employee_code || '') +
        rows.map(function (p, k) {
          var y = ROW_TOP + k * ROW_H;
          return [pi * ROWS_PER_PAGE + k + 1, dmy(p.ai_date || p.created_at), p.voucher_no, p.description,
            cell(p, 'receipt'), cell(p, 'substitute'), baht(p.amount)]
            .map(function (v, i) { return put(COLS[i][0], y, COLS[i][1], ROW_H, v, COLS[i][2]); }).join('');
        }).join('') +
        (last ? put(COLS[4][0], 592.6, COLS[4][1], 15.3, sum('receipt') ? baht(sum('receipt')) : '-', 'r') +
          put(COLS[5][0], 592.6, COLS[5][1], 15.3, sum('substitute') ? baht(sum('substitute')) : '-', 'r') +
          put(COLS[6][0], 592.6, COLS[6][1], 15.3, baht(sum(null)), 'r') +
          put(COLS[6][0], 607.9, COLS[6][1], 16.6, baht(sum(null)), 'r') : '') +
        (pages.length > 1 ? '<span class="pg">หน้า ' + (pi + 1) + '/' + pages.length + '</span>' : '') + '</div>';
    }).join('');
    // evidence photos in row order, two per page
    var photos = [];
    items.forEach(function (p, k) {
      (p.pc_photos || []).slice().sort(function (a, b) { return a.sort - b.sort; }).forEach(function (ph) { photos.push({ id: ph.id, label: 'ลำดับ ' + (k + 1) + ' · ' + (p.voucher_no || '') + ' · ' + baht(p.amount) + ' บาท' }); });
    });
    toast(photos.length ? 'กำลังโหลดรูปหลักฐาน ' + photos.length + ' รูป…' : 'กำลังเตรียมพิมพ์…');
    var art = new Promise(function (ok) { var im = new Image(); im.onload = im.onerror = ok; im.src = 'fac101.svg'; });
    Promise.all(photos.map(function (ph) {
      return photo(ph.id).then(function (src) { ph.src = src; }).catch(function () { ph.src = ''; });
    }).concat([art])).then(function () {
      var failed = photos.filter(function (ph) { return !ph.src; }).length;
      if (failed && !confirm('โหลดรูปไม่ได้ ' + failed + ' รูป จะพิมพ์ใบเคลียร์โดยไม่มีรูปเหล่านั้นไหม')) return;
      for (var i = 0; i < photos.length; i += 2) {
        html += '<div class="page">' + photos.slice(i, i + 2).map(function (ph) {
          return '<div class="photo">' + (ph.src ? '<img alt="หลักฐาน" src="' + ph.src + '">' : '<p>โหลดรูปไม่ได้</p>') + '<div>' + esc(ph.label) + '</div></div>';
        }).join('') + '</div>';
      }
      document.getElementById('print').innerHTML = html;
      setTimeout(function () { window.print(); }, 300);
    });
  }

  // ---------- helpers ----------
  function val(id) { return String(document.getElementById(id).value || '').trim(); }
  function dialog(inner, wide) {
    var d = document.getElementById('dlg');
    d.innerHTML = inner;
    d.classList.toggle('wide', !!wide);
    d.querySelectorAll('[data-close]').forEach(function (b) { b.onclick = closeDialog; });
    if (!d.open) d.showModal();
  }
  function closeDialog() { var d = document.getElementById('dlg'); if (d.open) d.close(); }
  function refresh() { return openWallet(S.wallet.id); }
  function refreshAll() {
    var id = S.wallet.id;
    return api('wallets').then(function (d) { S.wallets = d.wallets || []; return openWallet(id); });
  }
  function loadSettings() { return api('settings_get').then(function (d) { S.settings = d.settings || {}; }); }

  function start(sess, staff) {
    S.sess = sess; S.staff = staff;
    document.getElementById('who').innerHTML = '<span><b>' + esc(staff.n) + '</b>' + (staff.role === 'setter' ? 'ผู้ตั้งกระเป๋า' : 'แอดมิน') + '</span>' +
      '<div class="avatar" aria-hidden="true">' + esc(String(staff.n || '?').trim().charAt(0)) + '</div>';
    loadSettings().then(home).catch(fail);
  }

  var q = new URLSearchParams(location.search), sso = q.get('sso');
  if (sso) {
    q.delete('sso');
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString() : ''));
    api('session', { link: sso }).then(function (d) {
      try { sessionStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch (e) { /* storage blocked */ }
      start(d.session, d.staff);
    }).catch(function () { app.innerHTML = '<div class="card">ลิงก์หมดอายุหรือใช้ไปแล้ว กรุณาเปิดจากเมนู "เงินสดย่อย" ใน Job Tracker อีกครั้ง</div>'; });
  } else {
    var saved = null; try { saved = JSON.parse(sessionStorage.getItem(STORE_KEY)); } catch (e) { /* ignore */ }
    if (saved && saved.session) start(saved.session, saved.staff);
    else app.innerHTML = '<div class="card">กรุณาเปิดจากเมนู "เงินสดย่อย" ใน Job Tracker</div>';
  }
})();
</script>
</body>
